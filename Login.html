<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheets">
  <link rel="stylesheet" href="estilos/style.css" media="all">
</head>

<body>
  <main>
    <section>
      <div id="img">

      </div>

      <div id="caixa">
        <h1>Login</h1>
        <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu
          ambiente.
        </p>

        <form action="#">
          <div>
            <div class="caixa-for1">
              <i class="material-icons">person</i>
              <input type="email" name="email" id="iemail" placeholder="seu e-mail" required class="caixa-form2">
            </div>

            <div class="caixa-for1">
              <i class="material-icons">key</i>
              <input type="password" name="senha" id="isenha" placeholder="sua senha" required class="caixa-form2">
            </div>
          </div>
          <div>
            <input type="submit" value="Entrar" class="botoes" id="enter">
          </div>
          <div class="botoes" id="rec-senha">
            <a href="#">Esqueci a senha</a>
            <i class="material-icons">email</i>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>

</html>
